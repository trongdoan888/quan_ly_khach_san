version: '3.8'

services:
  backend:
    image: 10.19.18.58/hotel-reservation/hotel-reservation-backend:latest
    ports:
      - "8001:8000"
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=hotel_reservation
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db

  frontend:
    image: 10.19.18.58/hotel-reservation/hotel-reservation-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000/api

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=hotel_reservation
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: